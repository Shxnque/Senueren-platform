name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (for yarn classic pinned in package.json)
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          GENERATE_SOURCEMAP: false
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: yarn build

      # Pre-render per-route HTML so GitHub Pages returns HTTP 200 for every
      # SEO-indexable URL. Without this, BrowserRouter routes would 404 and
      # Google / Bing would skip indexing them. Each file is a copy of
      # index.html — when the SPA boots, react-router reads location.pathname
      # and renders the correct page.
      #
      # NOTE: Route list must match App.js <Routes>. Adding a route in App.js
      # without adding it here breaks that route's HTTP status (404) even
      # though the client-side render works.
      # Real prerender: writes a per-route HTML file with route-specific
      # <title>, meta description, canonical + OG tags AND a crawlable static
      # content block injected into <div id="root">. Non-JS crawlers / LLM
      # retrieval systems now see correct per-page metadata and real content;
      # real browsers discard the injected markup because src/index.js uses
      # ReactDOM.createRoot(...).render() (container children are replaced on
      # mount, so there is no hydration mismatch).
      # NOTE: route list lives in frontend/scripts/prerender.mjs and must match
      # App.js <Routes>. 404.html (SPA redirect) is emitted by CRA and untouched.
      - name: Pre-render SPA routes for SEO (per-route metadata + crawlable content)
        working-directory: frontend
        run: |
          node scripts/prerender.mjs
          echo "Pre-rendered routes:"
          ls -la build/*.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
